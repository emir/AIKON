# AIKON server. On the VPS, in this directory:
#   certs/server-chain.pem, certs/server.key   phone-facing TLS (our own CA)
#   secrets/anthropic_api_key                  Claude API key (MOCK_ANTHROPIC=0 with a Claude model)
#   secrets/openai_api_key                     OpenAI key (TRANSCRIBE=openai, or an openai: model)
#   secrets/xai_api_key                        xAI key (an xai: model)
#   secrets/gemini_api_key                     Gemini API key (a gemini: model)
#   secrets/admin_token                        generated on the server by deploy/push.sh
#   .env                                       settings below (no secrets)
#
#   docker compose up -d
#   docker compose logs -f        # JSON lines: method/path/status/ms/TLS, no content
services:
  server:
    build: .
    image: claude-s40-server:0.8.1
    pull_policy: never
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-low}
      CLAUDE_FALLBACKS: ${CLAUDE_FALLBACKS:-default}
      # models offered to the phone: provider:model-id[=Label],... (first =
      # default); empty = only CLAUDE_MODEL. MOCK_ANTHROPIC=1 mocks them all.
      MODELS: ${MODELS:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      OPENAI_EFFORT: ${OPENAI_EFFORT:-low}
      XAI_EFFORT: ${XAI_EFFORT:-}
      GEMINI_EFFORT: ${GEMINI_EFFORT:-low}
      MOCK_ANTHROPIC: ${MOCK_ANTHROPIC:-1}
      DAILY_REQUEST_LIMIT: ${DAILY_REQUEST_LIMIT:-100}
      DAILY_OUTPUT_TOKEN_LIMIT: ${DAILY_OUTPUT_TOKEN_LIMIT:-100000}
      WEB_SEARCH: ${WEB_SEARCH:-1}
      WEB_SEARCH_MAX_USES: ${WEB_SEARCH_MAX_USES:-3}
      DAILY_SEARCH_LIMIT: ${DAILY_SEARCH_LIMIT:-30}
      SEARCH_COUNTRY: ${SEARCH_COUNTRY:-}
      SEARCH_CITY: ${SEARCH_CITY:-}
      SEARCH_TIMEZONE: ${SEARCH_TIMEZONE:-}
      # voice messages: off, mock ("[Test mode]" text) or openai (paid)
      TRANSCRIBE: ${TRANSCRIBE:-off}
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      DAILY_TRANSCRIBE_LIMIT: ${DAILY_TRANSCRIBE_LIMIT:-30}
      DAILY_IMAGE_LIMIT: ${DAILY_IMAGE_LIMIT:-30}
      ADMIN_LISTEN: 0.0.0.0:9090
    ports:
      - "443:8443"
      - "127.0.0.1:9090:9090"   # admin: reachable only on the server itself
    volumes:
      - ./certs:/certs:ro
      - ./secrets:/run/secrets:ro
      - s40data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
volumes:
  s40data:
