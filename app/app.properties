# Single source of truth for package identity and version.
# tools/package.py writes these into the JAR manifest and the JAD; the MIDlet
# reads them back at run time with getAppProperty().
#
# Keep JAD/manifest values ASCII (the phone's JAD parser is not tested with
# anything else). No secrets here, ever: the access code is typed on the phone.
NAME=Claude S40
FILE_BASE=ClaudeS40
VENDOR=Emir Karsiyakali
VERSION=0.9.3
BUILD=018
MAIN_CLASS=io.github.emir.claudes40.ClaudeS40MIDlet
# MIDlet icon inside the JAR (generated by tools/make_art.py)
ICON=/icon.png
DESCRIPTION=An unofficial Claude client for Nokia Series 40.
CONFIGURATION=CLDC-1.1
PROFILE=MIDP-2.0
# HTTPS only; optional so an unsigned install is never refused over it.
# Files (saved replies) and calendar/to-do need no entry for an unsigned
# MIDlet: the phone asks the user before each use.
PERMISSIONS_OPT=javax.microedition.io.Connector.https
